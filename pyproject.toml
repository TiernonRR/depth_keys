[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-keys" 
version = "0.1.0"
description = "Depth rig experiment processing pipeline"
requires-python = ">=3.12,<3.14"

# The Core Dependencies
dependencies = [
    "scikit-learn",
    "numba",
    "scikit-image",
    "toml",
    "click",
    
    "sleap-nn==0.3.4",
    "markolab-cli @ git+https://github.com/markolab/markolab-cli.git",
    # "markovids @ git+https://github.com/triesenmy3/markovids.git" # incorrect
    # "markovids @ git+https://github.com/TiernonRR/markovids-tr.git@tr_changes
    "markovids @ git+https://github.com/markolab/markovids.git@integrate_tr_changes"
]

# Optional: Tools for development (install via `pip install .[dev]`)
[project.optional-dependencies]
dev = [
    "ipykernel",
    "pytest>=8",
]

[project.scripts]
depth-keys = "depth_keys.cli:cli"

